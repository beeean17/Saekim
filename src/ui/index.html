<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새김 - 마크다운 에디터</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/preview.css">
    <link rel="stylesheet" href="css/dialogs.css">
    <link rel="stylesheet" href="css/theme-dark.css" id="theme-stylesheet">

    <!-- QWebChannel for Python communication -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.0/marked.min.js"></script>

    <!-- DOMPurify for HTML sanitization (XSS prevention) -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <!-- Highlight.js for code syntax highlighting -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <!-- Common languages -->
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/cpp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/css.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/markdown.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/sql.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/bash.min.js"></script>

    <!-- Mermaid.js for diagram rendering -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>

    <!-- KaTeX for math equation rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>

<body>
    <div id="app">
        <!-- PDF Export Progress Modal -->
        <div id="pdf-progress-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>PDF 변환 중...</h3>
                </div>
                <div class="modal-body">
                    <div class="progress-info">
                        <span id="progress-text">준비 중...</span>
                        <span id="progress-percentage">0%</span>
                    </div>
                    <div class="progress-bar-container">
                        <div id="progress-bar" class="progress-bar"></div>
                    </div>
                    <div class="progress-details">
                        <small id="progress-details">변환 작업을 시작하는 중...</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Area with Toolbar and Split View -->
        <div class="main-area">
            <!-- Content Area -->
            <div class="content-area">
                <div class="workspace-toolbar">
                    <div class="toolbar-section">
                        <span class="toolbar-label">편집기</span>
                        <div class="toolbar-group">
                            <button class="btn-icon" id="btn-undo" title="실행 취소">↩️</button>
                            <button class="btn-icon" id="btn-redo" title="다시 실행">↪️</button>
                        </div>
                        <div class="toolbar-group">
                            <button class="btn-icon" id="btn-bold" title="굵게">B</button>
                            <button class="btn-icon" id="btn-italic" title="기울임">I</button>
                            <button class="btn-icon" id="btn-heading" title="제목">H</button>
                        </div>
                        <div class="toolbar-group">
                            <button class="btn-icon" id="btn-insert-image" title="이미지 삽입">🖼️</button>
                            <button class="btn-icon" id="btn-insert-table" title="표 삽입">📋</button>
                            <button class="btn-icon" id="btn-code-block" title="코드 블록">&lt;/&gt;</button>
                            <button class="btn-icon btn-helper" id="btn-katex-helper" title="KaTeX 수식 도우미">
                                <span class="helper-icon">fx</span>
                            </button>
                            <button class="btn-icon btn-helper" id="btn-mermaid-helper" title="Mermaid 다이어그램 도우미">
                                <span class="helper-icon">◇</span>
                            </button>
                        </div>
                        <div class="toolbar-group">
                            <button class="btn-icon" id="btn-find" title="찾기">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.5" />
                                    <line x1="10" y1="10" x2="14" y2="14" stroke="currentColor" stroke-width="1.5"
                                        stroke-linecap="round" />
                                </svg>
                            </button>
                            <button class="btn-icon btn-helper" id="btn-markdown-helper" title="마크다운 문법 도우미">
                                <span class="helper-icon">MD</span>
                            </button>
                        </div>
                    </div>
                    <div class="workspace-toolbar-divider"></div>
                    <div class="toolbar-section">
                        <span class="toolbar-label">미리보기</span>
                        <div class="toolbar-group">
                            <button class="btn-icon" id="btn-sync-scroll" title="스크롤 동기화" data-active="true">
                                🔗
                            </button>
                            <button class="btn-icon" title="확대">＋</button>
                            <button class="btn-icon" title="목차">☰</button>
                        </div>
                        <div class="toolbar-right">
                            <button class="btn-icon" title="내보내기">⇩</button>
                            <button class="btn-icon" id="btn-lock-preview" title="미리보기 잠금" data-active="true">
                                🔒
                            </button>
                        </div>
                    </div>
                </div>
                <div class="split-container" id="split-container">
                    <!-- Editor pane -->
                    <div class="pane editor-pane" id="editor-pane">
                        <div class="pane-content editor-content">
                            <div id="line-numbers" class="line-numbers" aria-hidden="true">1</div>
                            <div id="highlight-backdrop" class="highlight-backdrop" aria-hidden="true"></div>
                            <textarea id="editor" placeholder="# 여기에 마크다운을 작성하세요..."></textarea>
                        </div>
                    </div>

                    <!-- Resizer -->
                    <div class="resizer" id="resizer"></div>

                    <!-- Preview pane -->
                    <div class="pane preview-pane" id="preview-pane">
                        <div class="pane-content" id="preview">
                            <div class="preview-placeholder">
                                <p>마크다운 미리보기가 여기에 표시됩니다.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript modules -->
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/preview.js"></script>
    <script src="js/file.js"></script>
    <script src="js/toolbar.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/find-replace.js"></script>
    <script src="js/markdown-helper.js"></script>
    <script src="js/katex-helper.js"></script>
    <script src="js/mermaid-helper.js"></script>
</body>

</html>
