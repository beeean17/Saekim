# Workflow Status
# This tracks progress through BMM methodology Analysis, Planning, and Solutioning phases.
# Implementation phase is tracked separately in sprint-status.yaml

# STATUS DEFINITIONS:
# ==================
# Initial Status (before completion):
#   - required: Must be completed to progress
#   - optional: Can be completed but not required
#   - recommended: Strongly suggested but not required
#   - conditional: Required only if certain conditions met (e.g., if_has_ui)
#
# Completion Status:
#   - {file-path}: File created/found (e.g., "docs/product-brief.md")
#   - skipped: Optional/conditional workflow that was skipped

generated: "2026-01-17"
project: "Saekim"
project_type: "Markdown Editor Desktop Application"
selected_track: "bmad-method"
field_type: "brownfield"
workflow_path: "method-brownfield.yaml"

# Existing artifacts discovered during init
existing_artifacts:
  - path: "private/blueprint/ARCHITECTURE.md"
    type: "architecture-reference"
    note: "Existing architecture docs - may inform new PRD/Architecture"
  - path: "private/blueprint/FEATURES.md"
    type: "features-reference"
    note: "Feature specifications - input for PRD creation"
  - path: "private/blueprint/DEV_GUIDE.md"
    type: "dev-guide"
  - path: "private/blueprint/TECH_STACK.md"
    type: "tech-stack"
  - path: "private/blueprint/PROJECT_STRUCTURE.md"
    type: "project-structure"

workflow_status:
  # Phase 0: Documentation (Conditional)
  - phase: 0
    name: "Documentation"
    conditional: "if_undocumented"
    note: "Has existing docs in private/blueprint/ - may skip or enhance"
    workflows:
      - id: "document-project"
        status: "optional"
        agent: "analyst"
        command: "/bmad:bmm:workflows:document-project"
        note: "Existing docs found; run only if comprehensive update needed"

  # Phase 1: Analysis (Optional)
  - phase: 1
    name: "Analysis (Optional)"
    optional: true
    workflows:
      - id: "brainstorm-project"
        status: "optional"
        agent: "analyst"
        command: "/bmad:bmm:workflows:brainstorming"
      - id: "research"
        status: "optional"
        agent: "analyst"
        command: "/bmad:bmm:workflows:research"

  # Phase 2: Planning (Required)
  - phase: 2
    name: "Planning"
    required: true
    workflows:
      - id: "prd"
        status: "required"
        agent: "pm"
        command: "/bmad:bmm:workflows:prd"
        output: "Product Requirements Document"
      - id: "create-ux-design"
        status: "conditional"
        conditional: "if_has_ui"
        agent: "ux-designer"
        command: "/bmad:bmm:workflows:create-ux-design"
        note: "Recommended - this is a UI-heavy desktop application"

  # Phase 3: Solutioning (Required)
  - phase: 3
    name: "Solutioning"
    required: true
    workflows:
      - id: "create-architecture"
        status: "required"
        agent: "architect"
        command: "/bmad:bmm:workflows:create-architecture"
        output: "System Architecture Document"
      - id: "create-epics-and-stories"
        status: "required"
        agent: "pm"
        command: "/bmad:bmm:workflows:create-epics-and-stories"
        output: "Epics and Stories"
      - id: "test-design"
        status: "optional"
        agent: "tea"
        command: "/bmad:bmm:workflows:testarch-test-design"
      - id: "implementation-readiness"
        status: "required"
        agent: "architect"
        command: "/bmad:bmm:workflows:check-implementation-readiness"

  # Phase 4: Implementation (Required)
  - phase: 4
    name: "Implementation"
    required: true
    workflows:
      - id: "sprint-planning"
        status: "required"
        agent: "sm"
        command: "/bmad:bmm:workflows:sprint-planning"
        note: "Creates sprint plan - subsequent work tracked in sprint-status.yaml"
